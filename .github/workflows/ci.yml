name: Test and render

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLCONFIGDIR: ${{ github.workspace }}/work/matplotlib
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Scientific and package tests
        run: python -m unittest discover -s tests -v
      - name: Check syntax and undefined names
        run: ruff check src tests
      - name: Render committed summaries offline
        run: kb-study render
      - name: Verify filters and gallery
        run: node scripts/check_report.js
      - name: Build source and wheel distributions
        run: python -m build
